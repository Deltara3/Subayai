[project]
name = "subayai"
description = "Configuration CLI for Subayai-based touch keypads"
dynamic = ["version"]
authors = [
    { name = "Deltara" }
]
requires-python = ">=3.14.6"
dependencies = [
    "typer>=0.27",
    "rich>=15.0",
    "pyserial>=3.5"
]

[project.scripts]
subayai = "subayai.cli:app"

[tool.hatch.version]
path = "src/subayai/__init__.py"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"
